<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Flipkart Clone</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f3f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: white;
      width: 400px;
      padding: 30px;
      border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .logo {
      color: #2874f0;
      font-size: 24px;
      font-weight: bold;
      font-style: italic;
      margin-bottom: 20px;
      display: block;
      text-decoration: none;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 20px;
      color: #212121;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 14px;
      color: #878787;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #dbdbdb;
      border-radius: 2px;
      outline: none;
      font-size: 14px;
    }
    input:focus {
      border-color: #2874f0;
    }
    .login-btn {
      background: #fb641b;
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 2px;
      cursor: pointer;
      margin-top: 10px;
    }
    .login-btn:hover {
      background: #e05310;
    }
    .back-home {
      display: inline-block;
      margin-top: 20px;
      color: #2874f0;
      text-decoration: none;
      font-size: 14px;
    }
    .back-home:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <a href="index.html" class="logo">Flipkart</a>
    <h2>Login UI Preview (Demo)</h2>
    <p role="note" style="color:#b45309;background:#fff7ed;padding:10px;border-radius:4px;font-size:13px;">Demo interface only. No authentication backend is connected. Do not enter real account credentials.</p>\n    <form action="#" onsubmit="event.preventDefault(); return false;">
      <div class="form-group">
        <label for="email">Email / Mobile Number</label>
        <input type="text" id="email" required placeholder="Enter Email/Mobile number">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter Password">
      </div>
      <button type="button" class="login-btn" disabled aria-disabled="true" style="opacity:.6;cursor:not-allowed;">Login unavailable (demo)</button>
    </form>
    <a href="index.html" class="back-home">Back to Home</a>
  </div>

</body>
</html>
