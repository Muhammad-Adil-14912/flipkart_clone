<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Demo - Flipkart Clone</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f3f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .login-container {
      background: white;
      width: min(400px, 100%);
      padding: 30px;
      border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
      box-sizing: border-box;
    }
    .logo {
      color: #2874f0;
      font-size: 24px;
      font-weight: bold;
      font-style: italic;
      margin-bottom: 20px;
      display: block;
      text-decoration: none;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 20px;
      color: #212121;
    }
    .demo-notice {
      color: #92400e;
      background: #fff7ed;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 14px;
      color: #878787;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #dbdbdb;
      border-radius: 2px;
      outline: none;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:disabled {
      background: #f4f4f4;
      color: #777;
      cursor: not-allowed;
    }
    .login-btn {
      background: #fb641b;
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 2px;
      margin-top: 10px;
      opacity: .6;
      cursor: not-allowed;
    }
    .back-home {
      display: inline-block;
      margin-top: 20px;
      color: #2874f0;
      text-decoration: none;
      font-size: 14px;
    }
    .back-home:hover {
      text-decoration: underline;
    }
    a:focus-visible {
      outline: 3px solid #ffbf47;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="login-container">
    <a href="index.html" class="logo">Flipkart</a>
    <h2>Login UI Preview (Demo)</h2>
    <p class="demo-notice" role="note">Demo interface only. No authentication backend is connected. The fields are disabled; do not enter real account credentials.</p>
    <form>
      <div class="form-group">
        <label for="email">Email / Mobile Number</label>
        <input type="text" id="email" placeholder="Authentication unavailable" disabled>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Authentication unavailable" disabled>
      </div>
      <button type="button" class="login-btn" disabled aria-disabled="true">Login unavailable (demo)</button>
    </form>
    <a href="index.html" class="back-home">Back to Home</a>
  </main>
</body>
</html>
